<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
       

    .topnav {
        background-color: #333;
        height: 40px;
        display: flex;

    }

    .topnav a {
        color: #f2f2f2;
        text-decoration: none;
        font-size: 16px;
        padding: 0 16px;       
        line-height: 40px;     
    }

    .topnav a.active {
        background-color: #ff6b6b;
        color: white;
    }


    </style>
</head>

<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#">News</a>
        <a href="#">Contact</a>
        <a href="#">About</a>
    </div>
</body>
</html>
