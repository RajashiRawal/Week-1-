<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Boxes</title>

  <style>
    

.flex-container {
    display: flex;
    flex-wrap: nowrap;  
    border: 2px solid black;
    width: 525px;
    padding: 10px;
    gap: 10px;
}

.box {
    width: 120px;
    height: 80px;
    background-color: rgb(29, 196, 199);
    text-align: center;
    line-height: 80px;
    border: 1px solid black;
    flex-shrink: 0; 
}

@media screen and (max-width: 600px) {
    .flex-container {
        flex-wrap: wrap;  
        width: 100%;
    }

    .box {
        width: 45%;
    }
}
  </style>
</head>

<body>


  <div class="footer-box">
    Header Box
  </div>


  <div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
  </div>


  <div class="footer-box">
    Rectangle Box
  </div>

</body>
</html>
