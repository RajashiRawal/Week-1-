<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking - Maybelline</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { font-family: Arial; background: linear-gradient(135deg, #f5e6d3 0%, #d7ccc8 100%); }
.navbar { background: linear-gradient(135deg, #8d6e63 0%, #6d4c41 100%); }
.booking-form {
    max-width: 700px;
    background: #fff;
    padding: 40px;
    margin: 50px auto;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.booking-form h2 { color: #8d6e63; }
input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 2px solid #f0f0f0;
    border-radius: 8px;
}
input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #8d6e63;
}
label { font-weight: 600; color: #333; }
button {
    width: 100%;
    padding: 14px;
    background: #8d6e63;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}
button:hover { background: #6d4c41; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">Maybelline</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse justify-content-end" id="nav">
<ul class="navbar-nav">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
<li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
</ul>
</div>
</div>
</nav>

<div class="booking-form">
    <h2>Book an Appointment</h2>
    <p>Schedule your beauty session with us</p>
    <hr>
    <form>
        <label>Full Name</label>
        <input type="text" required>

        <label>Email</label>
        <input type="email" required>

        <label>Phone</label>
        <input type="tel" required>

        <label>Service</label>
        <select required>
            <option value="">Select a service</option>
            <option>Makeup Application</option>
            <option>Beauty Consultation</option>
            <option>Product Demo</option>
        </select>

        <label>Preferred Date</label>
        <input type="date" required>

        <label>Additional Notes</label>
        <textarea rows="3"></textarea>

        <button type="submit">Book Now</button>
    </form>
</div>

<footer class="py-4 text-white" style="background: linear-gradient(135deg, #8d6e63 0%, #6d4c41 100%);">
<div class="container text-center">
© 2026 Maybelline Beauty
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
